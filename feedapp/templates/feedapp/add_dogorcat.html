{% extends 'feedapp/base.html' %}
{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawFeeder - Add Pet</title>
  <link rel="stylesheet" type="text/css" href="{% static 'feedapp/css/add_dogorcat.css' %}">
  <style>
    body {
        background-image: url("{% static 'feedapp/images/dfbg.jpg' %}");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-color: rgba(220, 140, 80, 0.7);
        background-blend-mode: multiply;
        height: 100%;
        margin: 0;
    }
</style>
</head>
<body>    
<div class="container">
        <div class="card">
            <h4>Add Your Dog's Furbaby Here!</h4>
            <img src="{% static 'feedapp/images/dog.png' %}" alt="Dog Profile" class="profile-image"><br>
            <br><br>
            <a href="{% url 'add_pet_dog' %}" class="add-btn button-style">Add Dog</a>
    </div>

        <div class="card">
          <h4>Add Your Cat's Furbaby Here!</h4>
            <img src="{% static 'feedapp/images/cat.png' %}" alt="Cat Profile" class="profile-image"><br>
            <br><br>
            <a href="{% url 'add_pet_cat' %}" class="add-btn button-style">Add Cat</a>
        </div>
    </div>
</body>
</html>
{% endblock %}
